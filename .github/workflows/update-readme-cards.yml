name: Update README cards

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/update-readme-cards.yml"
      - "scripts/generate_readme_cards.py"
  schedule:
    # Refresh four times per day without depending on third-party card services.
    - cron: "17 */6 * * *"
  workflow_dispatch:

concurrency:
  group: update-readme-cards
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Generate cards from the GitHub API
        id: cards
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 scripts/generate_readme_cards.py \
            --username "${{ github.repository_owner }}" \
            --output-dir "$RUNNER_TEMP/readme-cards"

      - name: Validate and install generated cards
        if: steps.cards.outcome == 'success'
        run: |
          set -euo pipefail

          for card in stats.svg top-langs.svg activity.svg; do
            test -s "$RUNNER_TEMP/readme-cards/$card"
            grep -q '<svg' "$RUNNER_TEMP/readme-cards/$card"
            ! grep -Eqi \
              'Something went wrong|Resource not accessible|Maximum retries exceeded|Could not fetch' \
              "$RUNNER_TEMP/readme-cards/$card"
            install -m 0644 "$RUNNER_TEMP/readme-cards/$card" "profile/$card"
          done

      - name: Keep the last good cards after a transient API failure
        if: steps.cards.outcome == 'failure'
        run: |
          echo "::warning::GitHub API was temporarily unavailable; keeping the previously committed cards."

      - name: Commit cards
        if: steps.cards.outcome == 'success'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/stats.svg profile/top-langs.svg profile/activity.svg
          git diff --cached --quiet && exit 0
          git commit -m "chore: update README stat cards"
          git push
