name: Update README cards

on:
  schedule:
    # 每小时整点运行（UTC）；若需改为每 12 小时可用: 0 */12 * * *
    - cron: "0 * * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Generate stats card
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: stats
          # Avoid include_all_commits here: it calls GitHub's commit-search API,
          # which can reject the Actions integration token with HTTP 403.
          options: "username=${{ github.repository_owner }}&show_icons=true&hide_border=true&theme=transparent&rank_icon=github&hide=issues&title_color=0891b2&icon_color=0891b2&text_color=64748b"
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate top languages card
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: top-langs
          options: "username=${{ github.repository_owner }}&layout=compact&hide_border=true&theme=transparent&langs_count=6&card_width=320&size_weight=0.5&count_weight=0.5&title_color=0891b2&text_color=64748b"
          path: profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate generated cards
        shell: bash
        run: |
          set -euo pipefail

          for card in profile/stats.svg profile/top-langs.svg; do
            test -s "$card"
            grep -q '<svg' "$card"

            if grep -Eqi \
              'Something went wrong|Resource not accessible|Maximum retries exceeded|Could not fetch' \
              "$card"; then
              echo "::error file=$card::Card generation returned an error SVG; keeping the previously committed card."
              exit 1
            fi
          done

      - name: Commit cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          git commit -m "chore: update README stat cards" || exit 0
          git push
