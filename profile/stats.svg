<svg
  width="467"
  height="170"
  viewBox="0 0 467 170"
  fill="none"
  xmlns="http://www.w3.org/2000/svg"
  role="img"
  aria-labelledby="titleId descId"
>
  <title id="titleId">Ceylan's GitHub Stats, Rank: B</title>
  <desc id="descId">Total Stars Earned: 3029, Total Commits: 596, Total PRs: 7, Contributed to last year: 6</desc>
  <style>
    .header {
      font: 600 18px 'Segoe UI', Ubuntu, Sans-Serif;
      fill: #0891b2;
    }
    .label, .value {
      font: 600 14px 'Segoe UI', Ubuntu, Sans-Serif;
      fill: #64748b;
    }
    .value {
      font-weight: 700;
    }
    .icon {
      fill: #0891b2;
      font: 700 16px 'Segoe UI Symbol', 'Segoe UI', sans-serif;
    }
    .rank {
      fill: none;
      stroke: #0891b2;
      stroke-width: 6;
      stroke-linecap: round;
    }
    .rank-bg {
      opacity: 0.2;
    }
    .rank-text {
      font: 800 24px 'Segoe UI', Ubuntu, Sans-Serif;
      fill: #64748b;
      text-anchor: middle;
    }
  </style>

  <rect
    x="0.5"
    y="0.5"
    width="466"
    height="169"
    rx="4.5"
    fill="#ffffff00"
    stroke="#e4e2e2"
    stroke-opacity="0"
  />

  <text x="25" y="35" class="header">Ceylan's GitHub Stats</text>

  <text x="25" y="72" class="icon">★</text>
  <text x="50" y="72" class="label">Total Stars Earned:</text>
  <text x="244" y="72" class="value">3k</text>

  <text x="25" y="97" class="icon">↻</text>
  <text x="50" y="97" class="label">Total Commits:</text>
  <text x="244" y="97" class="value">596</text>

  <text x="25" y="122" class="icon">⑂</text>
  <text x="50" y="122" class="label">Total PRs:</text>
  <text x="244" y="122" class="value">7</text>

  <text x="25" y="147" class="icon">▣</text>
  <text x="50" y="147" class="label">Contributed to (last year):</text>
  <text x="244" y="147" class="value">6</text>

  <circle cx="380" cy="98" r="40" class="rank rank-bg" />
  <circle
    cx="380"
    cy="98"
    r="40"
    class="rank"
    stroke-dasharray="251.33"
    stroke-dashoffset="128"
    transform="rotate(-90 380 98)"
  />
  <text x="380" y="106" class="rank-text">B</text>
</svg>
